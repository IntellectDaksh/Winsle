name: Release

# Push a tag like v0.5.0 (matching tauri.conf.json "version") to build, sign and
# publish the installer plus latest.json for the in-app updater.
#
# Repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY            required  updater signature (contents of winsle.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   optional
#   WINSLE_SPOTIFY_CLIENT_ID             optional  enables "Connect Spotify" in this build
#   WINSLE_GOOGLE_CLIENT_ID              optional  enables "Connect Google Calendar"
#   WINSLE_GOOGLE_CLIENT_SECRET          optional  (Google desktop clients: not confidential)
#   WINSLE_MICROSOFT_CLIENT_ID           optional  enables "Connect Outlook"
#   WINDOWS_CERTIFICATE                  optional  base64 .pfx for Authenticode (removes SmartScreen warning)
#   WINDOWS_CERTIFICATE_PASSWORD         optional

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINSLE_SPOTIFY_CLIENT_ID: ${{ secrets.WINSLE_SPOTIFY_CLIENT_ID }}
      WINSLE_GOOGLE_CLIENT_ID: ${{ secrets.WINSLE_GOOGLE_CLIENT_ID }}
      WINSLE_GOOGLE_CLIENT_SECRET: ${{ secrets.WINSLE_GOOGLE_CLIENT_SECRET }}
      WINSLE_MICROSOFT_CLIENT_ID: ${{ secrets.WINSLE_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - run: npm ci
      - run: cargo build --release -p winsle-hook
      - run: cargo test --release --lib
        working-directory: app/src-tauri

      - name: Import code-signing certificate
        if: ${{ env.CERT != '' }}
        env:
          CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          $pw = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
          $c = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle.windows | Add-Member -Force certificateThumbprint $c.Thumbprint
          $conf.bundle.windows | Add-Member -Force digestAlgorithm sha256
          $conf.bundle.windows | Add-Member -Force timestampUrl http://timestamp.digicert.com
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding utf8

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Winsle ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md. Download Winsle_*_x64-setup.exe and run it.
          releaseDraft: true
          includeUpdaterJson: true
